<!DOCTYPE html>
<html><head><style>
    .sc-placeholder{background:color-mix(in srgb,currentColor 8%,transparent);
      border:1px solid color-mix(in srgb,currentColor 50%,transparent);
      border-radius:2px;box-sizing:border-box;overflow:hidden}
    @keyframes sc-shine{0%{background-position:100% 50%}100%{background-position:0% 50%}}
    html.sc-dc-streaming .sc-placeholder,
    html.sc-dc-streaming .sc-interp.sc-missing{position:relative;
      background:color-mix(in srgb,currentColor 5%,transparent);
      border-color:transparent}
    html.sc-dc-streaming .sc-placeholder::before,
    html.sc-dc-streaming .sc-interp.sc-missing::before{content:'';
      position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(90deg,rgba(217,119,87,0) 25%,rgba(247,225,211,.95) 37%,rgba(217,119,87,0) 63%);
      background-size:400% 100%;animation:sc-shine 1.4s ease infinite}
    html.sc-dc-streaming .sc-placeholder:nth-child(n+9 of .sc-placeholder)::before,
    html.sc-dc-streaming .sc-interp.sc-missing:nth-child(n+9 of .sc-interp.sc-missing)::before{animation:none;
      background:color-mix(in srgb,currentColor 8%,transparent)}
    .sc-placeholder-error{padding:4px 8px;font:11px/1.4 ui-monospace,monospace;
      color:color-mix(in srgb,currentColor 70%,transparent);word-break:break-word}
    .sc-interp.sc-missing{display:inline-block;width:2em;height:1em;overflow:hidden;
      vertical-align:text-bottom;background:rgba(255,255,255,.3);border:1px solid rgba(0,0,0,.5);
      border-radius:2px;box-sizing:border-box;color:transparent;
      user-select:none}
    .sc-interp.sc-unresolved{font-family:ui-monospace,monospace;font-size:.85em;
      color:color-mix(in srgb,currentColor 50%,transparent);
      background:color-mix(in srgb,currentColor 10%,transparent);border-radius:3px;
      padding:0 3px}
    .sc-host.sc-has-error{position:relative}
    .sc-logic-error{position:absolute;top:8px;left:8px;z-index:2147483647;max-width:60ch;
      padding:6px 10px;background:#b00020;color:#fff;font:12px/1.4 ui-monospace,monospace;
      border-radius:4px;white-space:pre-wrap;pointer-events:none}
    /* Mirrors PRINT_BASELINE_CSS in apps/web deck-stage-export.ts — keep both

    @media print {
      @page { margin: 0.5cm; }
      figure, table { break-inside: avoid; }
      #dc-root, #dc-root > .sc-host { height: auto; }
      *, *::before, *::after {
        print-color-adjust: exact; -webkit-print-color-adjust: exact;
        backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
        animation-delay: -99s !important; animation-duration: .001s !important;
        animation-iteration-count: 1 !important; animation-fill-mode: both !important;
        animation-play-state: running !important; transition-duration: 0s !important;
      }
    }

      unsubAll: () => { this.setState(st => ({ srcOn: Object.fromEntries([...REC_N, ...st.extra, ...OTHER_N].map(n => [n, false])), srcMore: false })); this.showToast('Вы отписались от всех каналов'); },
      restoreRec: () => { this.setState({ srcOn: {} }); this.showToast('Подборка по профилю восстановлена'); },
      profile: [
        { title: 'Компания', rows: [['Отрасль', 'Металлургия, прокат'], ['Выручка 2025', '52 млрд ₽'], ['Доля экспорта', '38%']] },
        { title: 'Валюты выручки', rows: [['USD', '26%'], ['CNY', '12%'], ['RUB', '62%']] },
        { title: 'Кредиты', rows: [['Плавающая ставка', '8,4 млрд ₽'], ['Фиксированная ставка', '5,1 млрд ₽']] },
        { title: 'Ключевые контрагенты', rows: [['Перевозчик', 'РЖД'], ['Поставщик сырья', 'ПАО «Уралруда»'], ['Покупатель', 'Vietnam Steel Trading']] },
      ].map(g => ({ title: g.title, rows: g.rows.map(([k, v], i) => ({ k, v, sep: i ? '1px solid rgba(255,255,255,.08)' : 'none' })) })),
      triggers: [['Пошлины и квоты на металлы', 'Сразу, push-уведомление'], ['Ключевая ставка ±1 п.п.', 'Сразу'], ['Санкции против контрагентов', 'Сразу, push и почта'], ['Курс USD ±5% за неделю', 'В сводке']].map(([label, sub], i) => ({ label, sub, sep: i ? '1px solid rgba(255,255,255,.08)' : 'none', ...sw(!!s.trig[i]), toggle: () => this.setState(st => ({ trig: { ...st.trig, [i]: !st.trig[i] } })) })),
      logout: () => this.showToast('Выход отключён в прототипе'),
      tgClick: e => { e.preventDefault(); e.stopPropagation(); this.showToast('Пост откроется в Telegram'); },
      tcOpen: !!nn && !!TRACK[nn.id] && !!CHAINS[nn.id], tc: nn && TRACK[nn.id] && CHAINS[nn.id] ? this.trackVals(nn) : {},
      newsOpen: !!nn, n: nn ? this.newsVals(nn) : {}, nsv: nn ? this.srcViewer('n-' + nn.id, this.newsVals(nn).posts) : { items: [], pills: [] }, c: nn ? this.chainVals(nn) : { dots: [], sheet: [], diffs: [], scenDiffs: [], tasks: [], archFacts: [], d2: [], line: [], wait: [], scen: [], l2: [], issued: [], drafts: [] },
      olComp: !!s.compose && !!s.comp, cv: this.compVals(), olFlow: s.olFlow || '', olLogin: s.olFlow === 'login', olConsent: s.olFlow === 'consent',
      olNext: () => this.setState({ olFlow: 'consent' }), olCancel: () => this.setState({ olFlow: null }),
      olAccept: () => { this.setState({ olFlow: null, launch: 'back2', ol: { connected: true, expired: false }, olSync: 'только что' }); setTimeout(() => { this.setState({ launch: null }); this.showToast('Outlook подключён · a.volkov@transmetall.ru'); }, 800); },
      nt: { analysis: s.ntab === 'analysis', sources: s.ntab === 'sources', scen: s.ntab === 'scen', act: s.ntab === 'act' },
      closeNews: () => this.setState({ news: null, compose: false }),
      toActions: () => this.setState({ ntab: 'act' }),
      composeOpen: false, mail,
      launching: !!s.launch, launchText: s.launch === 'draft' ? 'Открываем Outlook → Черновики' : s.launch === 'back2' ? 'Возвращаемся в «Ленту новостей»' : s.launch === 'back' ? 'Возвращаемся в «Ленту новостей»' : s.launch === 'thread' ? 'Открываем переписку в Outlook' : 'Открываем Outlook', launchSub: s.launch === 'back' ? 'Письмо отправлено с вашего ящика' : 'Письмо уже заполнено',
      closeCompose: () => { this.setState({ compose: false }); this.showToast('Черновик сохранён в Outlook'); },
      sendMail: () => {
        const t = now(), id = nn.id, upd = {}, keys = mail.picked.map(x => `${id}-${x.i}`);
        keys.forEach(k => { upd[k] = t; });
        const bump = (lvl, delay) => setTimeout(() => this.setState(st => { const m = { ...(st.mstat || {}) }, r = { ...(st.replyAt || {}) }; keys.forEach(k => { m[k] = Math.max(m[k] || 0, lvl); if (lvl === 2) r[k] = now(); }); return { mstat: m, replyAt: r }; }), delay);
        this.setState(st => ({ compose: false, launch: 'back', sent: { ...st.sent, ...upd }, mstat: { ...(st.mstat || {}), ...Object.fromEntries(keys.map(k => [k, 0])) } }));
        setTimeout(() => { this.setState({ launch: null }); this.showToast(`Отправлено через Outlook: ${keys.length} ${keys.length === 1 ? 'получатель' : 'получателя'}`); }, 800);
        bump(1, 3500); bump(2, 8000);
      },
      toast: s.toast, toastBottom: s.tab === 'feed' && !overlay && !s.reasonFor && !s.exp ? '724px' : '44px',
    };
  }
}
