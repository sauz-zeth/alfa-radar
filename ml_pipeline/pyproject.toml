[project]
name = "ml-pipeline"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.32.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.0",
    "sqlalchemy[asyncio]>=2.1.5",
]

[tool.uv]
package = false

[tool.uv.sources]
back = { path = "../back", editable = true }

[tool.pytest.ini_options]
pythonpath = ["../back/src", ".."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
